<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Wereldrijk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed map; one solid command bar on top, a docked sidebar on the right, End turn bottom-right.
   Look: neutral charcoal, bone ink, hairline rules, 2px corners. Colour belongs to the map and to meaning
   (red = attack, amber = war, blue = ally, green = gain); the chrome itself stays monochrome. */
:root{
  --bg:#0c0d0e; --panel:#151719; --panel2:#1d2023; --raise:#272a2e; --line:#2c3035; --line2:#454a51;
  --ink:#ecebe6; --mute:#9a9d9f; --on-ink:#111314;
  --red:#d8402f; --red-ink:#ff8a78; --green:#52b27c; --blue:#5b9fe0; --amber:#dea232;
  --r:2px; --bar:44px;
  --st:env(safe-area-inset-top,0px); --sr:env(safe-area-inset-right,0px); --sb:env(safe-area-inset-bottom,0px); --sl:env(safe-area-inset-left,0px);
  --f-disp:"Barlow Condensed","Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{position:fixed;inset:0}
#app svg{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.num{font-variant-numeric:tabular-nums}
.fl{line-height:1}
.spacer{flex:1 1 0}
.nc{display:inline-block;width:.78em;height:.78em;vertical-align:-.04em;box-shadow:inset 0 0 0 1px #0007;flex:none}

/* ---- command bar ---- */
#top{position:absolute;top:0;left:0;right:0;display:flex;align-items:stretch;padding:var(--st) var(--sr) 0 var(--sl);background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.empire{display:flex;align-items:center;gap:10px;background:none;border:0;border-right:1px solid var(--line);padding:0 14px 0 12px;min-width:0;max-width:30vw;height:var(--bar);box-sizing:border-box;text-align:left}
.empire .sw{width:12px;height:12px;flex:none;box-shadow:inset 0 0 0 1px #0007}
.empire .nmw{display:flex;flex-direction:column;gap:2px;min-width:0}
.empire b{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empire .rk{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;display:block;line-height:1}
.stats{display:flex;flex:0 1 auto;min-width:0;height:var(--bar);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}.stats::-webkit-scrollbar{display:none}
.stat{background:none;border:0;border-right:1px solid var(--line);padding:0 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;line-height:1;white-space:nowrap;box-sizing:border-box}
.stat small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.stat span{font-family:var(--f-disp);font-size:17px;font-weight:600}
button.stat{color:inherit;font:inherit;text-align:left;cursor:pointer}
.stat.ap span{display:flex;align-items:center;height:17px}
.stat .kit{display:flex;gap:10px}.stat .kit i{display:flex;align-items:center;gap:4px;font-style:normal}.stat .kit svg{width:15px;height:15px;color:var(--mute);flex:none}
.apd{display:flex;gap:3px;align-items:center}.apd i{width:9px;height:9px;box-sizing:border-box;border:1px solid var(--line2)}.apd i.on{background:var(--ink);border-color:var(--ink)}
#turnTag{font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:.02em;padding:0 14px;height:var(--bar);display:flex;align-items:center;white-space:nowrap;box-sizing:border-box;color:var(--mute)}
#turnTag.mine{color:var(--ink)}
.ibtn{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);height:40px;min-width:40px;padding:0 10px;font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:7px;justify-content:center;box-sizing:border-box}
.ibtn svg{width:20px;height:20px;flex:none}
#top .ibtn,#pickbar .ibtn{background:none;border:0;border-left:1px solid var(--line);border-radius:0;height:var(--bar);min-width:var(--bar);padding:0 13px}
.app-pick #top,.app-pick #dock,.app-pick #panel,.app-menu #top,.app-menu #dock,.app-menu #zoom,.app-menu #hint,.app-pick #hint{display:none!important}

/* ---- map controls ---- */
#dock{position:absolute;right:max(10px,var(--sr));bottom:calc(10px + var(--sb));display:flex;gap:8px;z-index:7;align-items:flex-end}
#endTurn{background:var(--ink);color:var(--on-ink);border:0;border-radius:var(--r);height:48px;padding:0 22px;font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:.08em;text-transform:uppercase}
#endTurn[disabled]{background:var(--raise);color:var(--mute)}
#zoom{position:absolute;left:max(10px,var(--sl));bottom:calc(10px + var(--sb));display:flex;flex-direction:column;z-index:5}
#zoom .ibtn{width:40px;height:40px;padding:0}
#zoom .ibtn+.ibtn{border-top:0}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sb));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 14px;font-size:14px;color:var(--mute);z-index:4;max-width:44vw;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- country sidebar ---- */
#panel{position:absolute;top:calc(var(--bar) + 1px + var(--st));right:0;bottom:0;width:calc(min(320px,44vw) + var(--sr));padding:0 var(--sr) calc(68px + var(--sb)) 0;background:var(--panel);border-left:1px solid var(--line);z-index:6;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease-out;overflow:hidden;box-sizing:border-box}
#timer{font-family:var(--f-disp);font-weight:700;font-size:17px;height:48px;min-width:66px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums;box-sizing:border-box}
#timer.low{color:#fff;background:var(--red);border-color:var(--red);}
@keyframes tpulse{50%{transform:scale(1.07)}}
#warbox{position:absolute;top:calc(var(--bar) + 10px + var(--st));right:max(10px,var(--sr));z-index:4;width:min(270px,42vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);font-size:13px;overflow:hidden}
#warbox[hidden]{display:none}
#warbox .wbh{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;padding:7px 10px;font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
#warbox .wbh span{display:flex;align-items:center;gap:4px}
#warbox .wbh svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#warbox .wbh .w{color:var(--ink)}#warbox .wbh .a{color:var(--ink)}#warbox .wbh .chev{margin-left:auto;color:var(--mute);font-size:12px}
#warbox .wbb{max-height:44vh;overflow-y:auto;padding:0 10px 9px;display:flex;flex-direction:column;gap:3px}
#warbox .wbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin-top:6px;font-weight:700}
#warbox .wbr{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--panel2);border:0;border-left:3px solid var(--ink);color:inherit;border-radius:0;padding:5px 8px;font:inherit}
#warbox .wbr.al{border-left-color:var(--ink)}
#warbox .wbr b{font-weight:600;display:flex;align-items:center;gap:6px}#warbox .wbr b .num{margin-left:auto;font-weight:500;color:var(--mute);font-size:12px}
#warbox .wbr small{color:var(--mute);font-size:11.5px;margin-top:1px}
.webar{height:6px;border-radius:0;background:var(--panel2);overflow:hidden}.webar i{display:block;height:100%;border-radius:0}
.lb-mor{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);gap:8px}
#panel.open{transform:none}
#panel .ph{padding:13px 14px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
#panel .ph .fl{font-size:27px}
#panel .ph h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:25px;line-height:1;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
#panel .ph .own{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.rel{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.rel::before{content:"";width:7px;height:7px;background:currentColor;flex:none}
.rel.mine{color:var(--ink)}.rel.ally{color:var(--blue)}.rel.war{color:var(--amber)}.rel.trade{color:var(--green)}
#panel .x{margin:-4px -6px 0 auto;width:32px;height:32px;display:grid;place-items:center;background:none;border:0;color:var(--mute);padding:0;flex:none}
#panel .x svg{width:20px;height:20px}
#panel .pb{overflow-y:auto;padding:13px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:11px;-webkit-overflow-scrolling:touch;touch-action:pan-y}

/* ---- shared pieces ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:1px}
.kv{outline:1px solid var(--line);padding:7px 10px 8px;display:flex;flex-direction:column;gap:3px;line-height:1;min-width:0}
.kv small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.kv b{font-family:var(--f-disp);font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl,.sec{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.sec{margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.note{font-size:13.5px;color:var(--mute);line-height:1.4}
.note b{color:var(--ink);font-weight:600}
.err{color:var(--red-ink);font-size:13.5px}
.warn{border:1px solid var(--amber);border-radius:var(--r);color:#f0c477;padding:8px 10px;font-size:13.5px;line-height:1.35}
.btn{border:1px solid var(--line2);border-radius:var(--r);padding:9px 12px;font-family:var(--f-disp);font-weight:600;font-size:16px;line-height:1.15;letter-spacing:.02em;background:var(--raise);color:var(--ink)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.38}
.btn.wide{width:100%}
.btn.big{padding:12px 14px;font-size:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.btn small{font-family:var(--f-body);font-weight:500;font-size:13px;opacity:.75;letter-spacing:0;text-transform:none}
.btn:active:not([disabled]),.ibtn:active,#endTurn:active:not([disabled]){transform:translateY(1px)}
@media (hover:hover){.btn:hover:not([disabled]):not(.ghost),#endTurn:hover:not([disabled]){filter:brightness(1.1)}.btn.ghost:hover:not([disabled]),.ibtn:hover,button.stat:hover,.empire:hover,.chip:hover:not(.on):not([disabled]),.cbtn:hover:not(.on):not([disabled]),.mode:hover{background-color:var(--panel2)}.tab:hover,.nfil button:hover:not(.on){color:var(--ink)}}
.dipbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dipbtns .btn{font-size:15px;padding:9px 6px}
.opbar{height:4px;background:var(--line);position:relative}
.opbar i{position:absolute;top:0;bottom:0}
.opbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--mute)}
.kitrow{display:flex;gap:6px 16px;flex-wrap:wrap}.kitrow span{display:flex;align-items:center;gap:5px;font-size:13px}.kitrow svg{width:16px;height:16px;color:var(--mute)}.kitrow b{font-family:var(--f-disp);font-size:16px;font-weight:600}.kitrow small{color:var(--mute);font-size:12px}
input[type=text]{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:10px 11px;color:var(--ink);font:inherit;font-size:16px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
input[type=text]::placeholder{color:#70747a}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:34px;min-width:0;margin:0;background:none;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,var(--ink) var(--p),var(--line2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:22px;margin-top:-10px;background:var(--ink);border:0;border-radius:1px}
input[type=range]::-moz-range-track{height:2px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:2px;background:var(--ink)}
input[type=range]::-moz-range-thumb{width:12px;height:22px;background:var(--ink);border:0;border-radius:1px}

/* ---- dialogs ---- */
.scrim{position:absolute;inset:0;background:#060707cc;z-index:40;display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--st)) max(16px,var(--sr)) calc(10px + var(--sb)) max(16px,var(--sl))}
.sheet{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:16px 18px 18px;width:min(480px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;touch-action:pan-y;box-sizing:border-box}
.sheet.wide{width:min(820px,100%)}
.sheet>*{flex-shrink:0}
.sheet h3{margin:0;font-family:var(--f-disp);font-weight:700;font-size:25px;line-height:1.05;letter-spacing:.01em;display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.sheet h3 svg{width:22px;height:22px;align-self:center}
.sheet h3 .note{font-family:var(--f-body);letter-spacing:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:1px}
.vs .side{outline:1px solid var(--line);padding:9px 12px 10px;min-width:0}
.vs .side small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .side .nm{font-weight:600;font-size:14.5px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs .side b{font-family:var(--f-disp);font-size:32px;font-weight:700;line-height:1.05}
#oddsT{font-family:var(--f-disp);font-size:19px;font-weight:700;letter-spacing:.01em}
.ulist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.urow{display:grid;grid-template-columns:22px 104px minmax(0,1fr) minmax(86px,auto);gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:2px 0}
.pq{display:flex;grid-column:3;grid-row:2;margin:-9px 0 6px}.pq button{flex:1;background:none;border:1px solid var(--line2);color:var(--mute);font:600 11.5px/1 var(--f-body);padding:3px 0;border-radius:0;cursor:pointer;font-variant-numeric:tabular-nums}.pq button+button{border-left:0}.pq button:first-child{border-radius:var(--r) 0 0 var(--r)}.pq button:last-child{border-radius:0 var(--r) var(--r) 0}.pq button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pqall{display:flex;align-items:center;justify-content:space-between;gap:10px}.pqall .lbl{white-space:nowrap}.pqall .pq{margin:0;flex:0 1 230px}.pqall .pq button{padding:5px 0;font-size:12px}
@media (hover:hover){.pq button:hover:not(.on){background:var(--panel2);color:var(--ink)}}
.urow svg{width:20px;height:20px;color:var(--mute)}.urow .un{font-size:14.5px;font-weight:600;white-space:nowrap}.urow b{font-family:var(--f-disp);font-size:19px;font-weight:600;text-align:right;white-space:nowrap}.urow b small{color:var(--mute);font-size:13px;font-weight:500}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 14px 10px;font-family:var(--f-disp);font-weight:600;font-size:17px;letter-spacing:.02em;color:var(--mute);white-space:nowrap}
.tab:first-child{padding-left:0}
.tab.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:1px;padding:1px}
.up{outline:1px solid var(--line);padding:11px 12px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.up .t{display:flex;align-items:center;gap:10px}
.up svg{width:26px;height:26px;flex:none}
.up b{font-family:var(--f-disp);font-size:19px;font-weight:700;line-height:1.05;letter-spacing:.01em}
.up .lv{font-size:12.5px;color:var(--mute)}
.up .d{font-size:13px;color:var(--mute);line-height:1.35;flex:1}
.up .btn{padding:7px 8px;font-size:15px}
.pips{display:flex;gap:2px}.pips i{flex:1;max-width:14px;height:4px;background:var(--line)}.pips i.on{background:var(--ink)}
.opt{display:flex;flex-direction:column;gap:8px}
.opt b{font-family:var(--f-disp);font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:none;border-radius:var(--r);padding:6px 11px;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip[disabled]:not(.on){opacity:.45}
.mtabs{display:flex}.mtabs .chip{flex:1;text-align:center;padding:7px 4px;border-radius:0}.mtabs .chip+.chip{border-left:0}
.dlist{display:flex;flex-direction:column}
.drow{display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:8px 0;font-size:15px}
.drow:first-child{border-top:1px solid var(--line)}
.drow .r{margin-left:auto;display:flex;gap:5px}
.drow .btn{padding:5px 10px;font-size:14px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:34px;height:34px;border:0;border-radius:0;padding:0}
.swatches button.on{outline:2px solid var(--ink);outline-offset:2px}
.board{width:100%;border-collapse:collapse;font-size:14.5px}
.board td,.board th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.board th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600;border-bottom-color:var(--line2)}
.board td:nth-child(2),.board th:nth-child(2){text-align:left;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.board tr.me td{background:var(--panel2);font-weight:700}
.tw{overflow-x:auto}
.news{display:flex;flex-direction:column}
.nfil{display:grid;grid-template-columns:repeat(4,1fr)}
.nfil button{background:none;border:1px solid var(--line2);border-left-width:0;border-radius:0;padding:8px 2px;font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.02em;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nfil button:first-child{border-left-width:1px}
.nfil button.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.nrd{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:16px 0 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.nrd:first-child{padding-top:2px}
.nit{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;padding:7px 0;font-size:14.5px;line-height:1.35;color:#c4c6c4}
.nit svg{width:18px;height:18px;margin-top:1px;color:var(--mute)}
.nit b{font-weight:600;color:var(--ink)}

}

function aiBuyUnits(n,budget){

// AI: keep the land army spread over its continents by population, with extra troops where the enemies are.

// NPC pacts: countries ally against a shared enemy or a shared big neighbour, and drift apart when that reason is gone.
function aiAlliances(s,NB){

    let thr=-1,tp=0;for(const t of NB[n]){if(G.N[t].dead||allied(n,t)||t===p)continue;if(s[t].power>tp){tp=s[t].power;thr=t}}

  const ids=[];for(let n=0;n<NN;n++)if(!G.N[n].dead&&!isHuman(n))ids.push(n);shuffle(ids);
  for(const n of ids){

    let best=-1,bs=0;
    for(const p of cand){if(p===n||G.N[p].dead||isHuman(p)||allied(n,p)||atWar(n,p)||dip().al[p].size>=3)continue;
      const m=Math.min(score(n,p),score(p,n));if(m>=.9&&m>bs){bs=m;best=p}}
    if(best>=0&&rnd()<.6)makeAlliance(n,best);
  }
  for(const n of ids){if(G.N[n].dead)continue;
    for(const p of [...dip().al[n]]){if(p<n||G.N[p].dead||isHuman(p))continue;
      if(Math.max(score(n,p),score(p,n))<.9&&rnd()<.04){delete G.al[pk(n,p)];dipDirty();addLog(`Het bondgenootschap tussen ${natName(n)} en ${natName(p)} loopt af`,[n,p],'info')}}}
}
// NPC trade: every country keeps up to 6 treaties, preferring rich partners, allies and neighbours it trusts.
function aiTrade(s,NB){
  const rich=[];for(let n=0;n<NN;n++)if(!G.N[n].dead)rich.push(n);rich.sort((a,b)=>s[b].gdp-s[a].gdp);const top=rich.slice(0,10);

  for(const n of ids){

const WIN_SHARE=.35;
function roundEnd(){

  for(const k of Object.keys(G.occ)){const r=+k,o=G.occ[k],ow=G.R.o[r],c=CONT[r];if(!G.N[ow].a||!G.N[o[0]].a)continue;const dg=G.N[ow].a[c],og=G.N[o[0]].a[c];
    if(dg>og*1.2+500){o[1]-=.06;if(o[1]<=.01)delete G.occ[k]}}
  for(let n=0;n<NN;n++){const N=G.N[n];N.we=Math.round((N.we||0)*(dip().war[n].size?.88:.6));if(!dip().war[n].size)N.capL=0;N.hit=Math.floor((N.hit||0)/2);N.cq=Math.floor((N.cq||0)*.7);if(N.last&&!dip().war[n].size)N.last=0}
  for(const k in G.op){const [a,h]=k.split('>').map(Number);let v=G.op[k];v+=trading(a,h)?2:0;v+=allied(a,h)?1:0;G.op[k]=Math.round(v*.97)}

  G.round++;dirty();
  const s=stats();let best=-1,bk=0;for(let n=0;n<NN;n++){if(!G.N[n].dead&&s[n].km>bk){bk=s[n].km;best=n}}
  const humansAlive=G.order.filter(n=>!G.N[n].dead);
  if(bk/WORLD_KM>=WIN_SHARE||(G.maxR&&G.round>G.maxR)||!humansAlive.length){G.over={winner:best,reason:bk/WORLD_KM>=WIN_SHARE?'wereld':!humansAlive.length?'dood':'rondes'};addLog(`Het spel is voorbij: ${natName(best)} is het grootste land ter wereld!`,[best],'cap')}
}
function endTurn(){

  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];gesture={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),s0:cam.s,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:cam.x,cy:cam.y}}});

function dipAction(type,o){
  const N=G.N[ME];N.asked=N.asked||{};const key=o+type;
  if(type==='give'){openGive(o);return}
  if(!isHuman(o)&&N.asked[key]===G.round){toast(`${esc(natName(o))} heeft deze ronde al geantwoord.`);return}
  if(type==='ask'){openAsk(o);return}
  if(type==='join'){if(!useAP())return;N.asked[key]=G.round;
    if(acceptJoin(o,ME)){mergeInto(o,ME,null);toast(`<b>${esc(natName(o))}</b> sluit zich bij je aan! Hun land en leger zijn nu van jou.`,'win');selN=-1}
    else{addOp(o,ME,-4);toast(`${esc(natName(o))} wil zelfstandig blijven.`,'lose')}
    dirty();markSeen();G.rev++;afterAction();return}
  if(!useAP())return;
  if(type==='breakAl'){delete G.al[pk(ME,o)];dipDirty();addOp(o,ME,-35);addLog(`${natName(ME)} zegt het bondgenootschap met ${natName(o)} op`,[ME,o],'war');G.rev++;afterAction();return}
  if(type==='surr'){N.asked[key]=G.round;const r=considerSurrender(o,ME,true);
    if(r==='cap'){toast(`<b>${esc(natName(o))} capituleert!</b> Al hun land is nu van jou.`,'win');selN=-1}
    else if(r==='last')toast(`${esc(natName(o))} weigert en vecht tot het bittere einde.`,'lose');
    else if(r==='peace'){toast(`${esc(natName(o))} wil zich niet overgeven, maar biedt vrede aan.`,'win');setTimeout(showOffers,300)}
    else toast(`${esc(natName(o))} lacht je uit: ze zijn nog lang niet verslagen.`,'lose');
    dirty();markSeen();G.rev++;afterAction();return}
  if(isHuman(o)){G.offers.push({type,from:ME,to:o,r:G.round});toast(`Voorstel verstuurd naar ${esc(G.hum[o]?.nick||natName(o))}.`);G.rev++;afterAction();return}
  N.asked[key]=G.round;
  const ok=accept(o,ME,type);
  if(ok){if(type==='ally')makeAlliance(ME,o);else if(type==='trade')makeTrade(ME,o);else if(type==='peace')makePeace(ME,o);addOp(o,ME,5);toast(`<b>${esc(natName(o))}</b> gaat akkoord!`,'win')}
  else{addOp(o,ME,-3);toast(`${esc(natName(o))} wijst je voorstel af`,'lose')}
  markSeen();G.rev++;afterAction();
}

const NICO={war:'<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>',bomb:ICON.bomb,atk:'<path d="M4 12h15M13 6l6 6-6 6"/>',peace:'<path d="m5 12 4.5 4.5L19 7"/>',ally:'<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',trade:'<path d="M4 8h15l-3-3M20 16H5l3 3"/>',merge:'<path d="M6 4v4a6 6 0 0 0 6 6v6M18 4v4a6 6 0 0 1-6 6"/>',elim:'<circle cx="12" cy="12" r="8"/><path d="m9 9 6 6M15 9l-6 6"/>',hit:'<path d="M12 4v9M12 18v.5"/>',info:'<circle cx="12" cy="12" r="2"/>'};
function newsType(l){const t=l.t;if(l.k==='elim'||l.k==='cap')return'elim';if(l.k==='hitme')return'hit';if(/bombardeert/.test(t))return'bomb';if(/ valt .* aan:/.test(t))return'atk';if(/voegen samen/.test(t))return'merge';return NICO[l.k]?l.k:'info'}
function newsGroup(ty){return ['war','bomb','atk','hit','elim'].includes(ty)?'war':['peace','ally','trade','merge'].includes(ty)?'dip':'oth'}
function newsRow(l){const ty=newsType(l);let t=esc(l.t);const nm=[...new Set(l.n.filter(n=>n!=null).map(n=>esc(natName(n))))].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(nm.length)t=t.replace(new RegExp(nm.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g'),'<b>$&</b>');
  const m=t.match(/^(.*?): (?=[+\d]|geen )(.+)$/)||t.match(/^(Coalitie.*?!) (.+)$/);const hd=m?m[1]:t,sub=m?m[2]:'';
  return `<div class="nit t-${ty}${l.n.includes(ME)?' me':''}"><svg viewBox="0 0 24 24">${NICO[ty]}</svg><span>${l.n[0]!=null?natFlag(l.n[0]):''}${hd}${sub?`<span class="ns">${sub}</span>`:''}</span></div>`}
function newsList(items){let r=null,h='';items.forEach(l=>{if(l.r!==r){r=l.r;h+=`<div class="nrd">Ronde ${r}</div>`}h+=newsRow(l)});return h||'<div class="note" style="padding:10px 0">Niets in deze categorie.</div>'}

  openSheet(`<h3>Nieuws <span class="note" style="font-weight:500">begin ronde ${G.round}</span></h3><div class="news">${items.slice(-8).reverse().map(newsRow).join('')}</div><button class="btn pri wide" id="nC">Verder</button>`,sh=>sh.querySelector('#nC').onclick=()=>{closeSheet();then&&then()},true);

function showHelp(){
  openSheet(`<h3>Hoe werkt Wereldrijk?</h3><div class="note" style="font-size:14px;line-height:1.5;color:var(--ink)">
  <p style="margin:0 0 8px"><b>Doel.</b> Word het grootste land ter wereld. Na de laatste ronde wint wie het meeste land heeft.</p>
  <p style="margin:0 0 8px"><b>Aanvallen.</b> Tik op een buurland en dan op Aanvallen. Kies hoeveel soldaten je stuurt. Veroverd land krijgt meteen jouw kleur en het front schuift over de hele grens op. Verdedigers vechten thuis sterker en geluk speelt mee. Druk op STOP wanneer je wilt; het front blijft staan voor je volgende aanval.</p>
  <p style="margin:0 0 8px"><b>Continenten.</b> Soldaten en tanks staan op een continent en verdedigen alleen daar. Heb je land op een ander continent, verplaats dan troepen (tik op je eigen land). Een gebied zonder leger wordt snel veroverd. Vliegtuigen, schepen en bommen kunnen overal heen, en vliegtuigen laten het front sneller opschuiven.</p>
  <p style="margin:0 0 8px"><b>Gevechten.</b> Niet alleen het grootste leger wint. Moreel, het initiatief en uitputting bepalen wie die dag beter vecht, dus het front gaat heen en weer. Een land dat moe is van de oorlog of zijn hoofdstad kwijt is, geeft zich eerder over of vraagt om vrede.</p>
  <p style="margin:0 0 8px"><b>Diplomatie.</b> Vraag andere landen om iemand aan te vallen, geef ze troepen, wapens of geld, of vraag of ze bij je land willen horen.</p>
  <p style="margin:0 0 8px"><b>Tijd.</b> Je hebt per beurt beperkt tijd (rechtsonder). Is die op, dan eindigt je beurt vanzelf.</p>
  <p style="margin:0 0 8px"><b>Bevelen.</b> Elke ronde heb je een paar bevelen (de witte blokjes bovenin). Aanvallen, bouwen of een voorstel doen kost 1 bevel.</p>
  <p style="margin:0 0 8px"><b>Groeien.</b> Elke ronde komen er vanzelf soldaten bij uit je bevolking. Bouw woningen voor meer inwoners en kazernes voor meer soldaten. Hoe groter je land, hoe hoger je rang en hoe meer bevelen.</p>
  <p style="margin:0 0 8px"><b>Leger &amp; wapens.</b> Koop soldaten, tanks, gevechtsvliegtuigen, oorlogsschepen en bommen (knop Materieel bovenin). Bij een aanval kies je wat je meestuurt. Schepen heb je nodig om over zee aan te vallen. Met bommen verzwak je een vijand vooraf.</p>
  <p style="margin:0 0 8px"><b>Overgave.</b> Een land dat bijna verslagen is, kan capituleren: dan krijg je al zijn land. Sommige landen vechten liever tot het bittere einde. Je kunt ook zelf overgave eisen.</p>
  <p style="margin:0"><b>Pas op.</b> Wie snel groeit of een land omsingelt, maakt de buren bang. Ze kunnen als eerste aanvallen, een coalitie tegen je vormen of samengaan tot één land. Bij vrede wordt het front de nieuwe grens.</p></div><button class="btn pri wide" id="hC">Begrepen</button>`,s=>s.querySelector('#hC').onclick=closeSheet)}
function countryBtns(ids,selNn,taken){return `<div class="clist2">${ids.map(n=>`<button class="cbtn ${selNn===n?'on':''}" data-n="${n}" ${taken&&taken.has(n)?'disabled':''}>${natFlag(n)}<span>${esc(NAT[n].name)}</span></button>`).join('')}</div>`}
function startPick(mode){
  closeScreen();cancelAnimationFrame(drift);G=previewState();dirty();
  PICK={mode,players:[],cur:-1,diff:-1,opts:{maxR:30,tl:90}};setMode('pick');resize();cam.s=minS();cam.x=-(WW*cam.s-VW)/2;clampCam();renderPick();req();
}
function renderPick(){
  const P=PICK;const card=$('#pickcard');const n=P.cur;const taken=new Set(P.players.map(p=>p.nation));
  $('#pkTitle').textContent=P.diff<0?'Kies een moeilijkheid':P.mode==='local'?`Speler ${P.players.length+1}: kies je land`:'Kies je land';
  $('#pkSub').textContent=P.diff<0?'Daarna kies je een land uit die modus':'Tik op een land met een witte rand';
  let h='';
  if(P.diff<0){h+=`<div class="modes">${MODES.map((m,i)=>`<button class="mode" data-m="${i}"><b>${m.nm}</b><span class="note">${m.sub}</span></button>`).join('')}</div>`}
  else{
    const M=MODES[P.diff];
    if(!P.players.length)h+=`<div class="mtabs">${MODES.map((m,i)=>`<button class="chip ${P.diff===i?'on':''}" data-m="${i}">${m.nm}</button>`).join('')}</div>`;
    else h+=`<div class="lbl">Modus: ${M.nm}</div>`;
    h+=countryBtns(M.ids,n,taken);
    if(n>=0){const d=NAT[n];
      h+=`<div class="grid2"><div class="kv"><small>Soldaten</small><b>${fmtT(d.mil*1000)}</b></div><div class="kv"><small>Inwoners</small><b>${fmtPop(d.pop)}</b></div></div>`;
      if(P.mode==='local')h+=`<input type="text" id="pkNick" maxlength="16" placeholder="Naam speler ${P.players.length+1}" aria-label="Naam speler">`;
      h+=`<button class="btn pri big wide" id="pkGo" ${taken.has(n)?'disabled':''}>${P.mode==='solo'?'Speel met '+esc(d.name):'Kies '+esc(d.name)}</button>`}
    if(P.mode==='local'){h+=`<div class="plist">${P.players.map((p,i)=>`<div class="pl"><i style="background:${PALETTE[i]}"></i><b>${esc(p.nick)}</b><span class="r">${esc(NAT[p.nation].name)}</span></div>`).join('')}</div><button class="btn ${n<0?'pri':''} wide" id="pkStart" ${P.players.length<2?'disabled':''}>${P.players.length<2?'Minstens 2 spelers nodig':'Start met '+P.players.length+' spelers'}</button>`}
  }
  card.innerHTML=h;
  card.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{P.diff=+b.dataset.m;P.cur=-1;bordersDirty=true;renderPick();cam.s=minS();clampCam();req()});
  card.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{P.cur=+b.dataset.n;bordersDirty=true;renderPick();focusNation(P.cur,-100)});
  const go=$('#pkGo');if(go)go.onclick=()=>{
    if(P.mode==='solo'){beginGame('solo',[{nick:'Jij',nation:n,color:PALETTE[0]}]);return}
    const nick=($('#pkNick').value.trim()||'Speler '+(P.players.length+1)).slice(0,16);P.players.push({nick,nation:n,color:PALETTE[P.players.length]});P.cur=-1;bordersDirty=true;
    if(P.players.length>=4||P.players.length>=MODES[P.diff].ids.length){beginGame('local',P.players);return}renderPick();req()};
  const st=$('#pkStart');if(st)st.onclick=()=>beginGame('local',P.players);
}
$('#pkBack').onclick=()=>{if(PICK&&PICK.diff>=0&&!PICK.players.length){PICK.diff=-1;PICK.cur=-1;bordersDirty=true;renderPick();req();return}PICK=null;showMenu()};
$('#pkOpts').onclick=()=>pickOptions();
function pickOptions(){const o=PICK.opts;
  openSheet(`<h3>Spelopties</h3><div class="opt"><b>Aantal rondes</b><div class="note">Hoe lang het spel duurt. Daarna wint het grootste land.</div><div class="chips">${[25,40,60,0].map(v=>`<button class="chip ${o.maxR===v?'on':''}" data-r="${v}">${v||'Onbeperkt'}</button>`).join('')}</div></div>
   <div class="opt"><b>Tijd per beurt</b><div class="note">Is de tijd op, dan eindigt je beurt vanzelf.</div><div class="chips">${TL_OPTS.map(([v,l])=>`<button class="chip ${(o.tl??90)===v?'on':''}" data-tl="${v}">${l}</button>`).join('')}</div></div>
   <button class="btn pri wide" id="poC">Klaar</button>`,s=>{s.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{o.maxR=+b.dataset.r;pickOptions()});s.querySelectorAll('[data-tl]').forEach(b=>b.onclick=()=>{o.tl=+b.dataset.tl;pickOptions()});s.querySelector('#poC').onclick=closeSheet})}
const TL_OPTS=[[60,'1 min'],[90,'1,5 min'],[150,'2,5 min'],[0,'Geen']];
function beginGame(mode,humans){
  const o=PICK.opts;const diff=PICK.diff;PICK=null;
  G=initialState({mode,humans,maxR:o.maxR,diff,tl:o.tl??90});ME=G.order[0];startTurn(ME);addLog('Het spel is begonnen!',[],'info');
  G.order.forEach(n=>{G.N[n].seen=G.lc;if(n!==ME)G.N[n].ap=apMax(n)});G.N[ME].lastR=0;
  startPlaying();if(mode==='local')handoff();
}
function startPlaying(){
  closeScreen();closeSheet();cancelAnimationFrame(drift);PICK=null;selN=-1;setMode('game');DIP=null;dirty();resize();
  cam.s=minS();clampCam();
  if(ME>=0)setTimeout(()=>focusNation(ME,-60),60);
  updateHud();renderPanel();req();persist();
  if(G.over)gameOver();else if(G.mode!=='local')setTimeout(beginMyTurn,700);
}

/* ================= online ================= */
async function netInit(){
  if(NET.ready)return NET.ready;
  NET.ready=(async()=>{
    try{const c=window.claude;if(c&&c.use){const [db,user]=await Promise.all([c.use('db'),c.use('user')]);NET.db=db;NET.user=user;if(user){try{NET.uid=await user.id()}catch(e){}}}}catch(e){}
    if(!NET.db&&window.WRNet){try{if(await WRNet.ready())NET.db=WRNet}catch(e){}}
    if(!NET.uid){try{NET.uid=localStorage.getItem('wr-uid')}catch(e){}if(!NET.uid){NET.uid='g'+Math.random().toString(36).slice(2,10);try{localStorage.setItem('wr-uid',NET.uid)}catch(e){}}}
    if(!NET.db)NET.ready=null;
  })();return NET.ready;
}
function nickGet(){try{return localStorage.getItem('wr-nick')||''}catch(e){return ''}}
function nickSet(v){try{localStorage.setItem('wr-nick',v)}catch(e){}}
async function showOnline(){
  const s=setScreen(`<div class="menuWrap"><div><div class="logo sm">Online</div><div class="tag">Speel tegen vrienden, ieder op een eigen telefoon. Iedereen kiest een land uit dezelfde modus en jullie spelen om de beurt.</div><div class="note" id="netNote" style="margin-top:10px">Verbinding maken…</div></div>
    <div class="menuBtns"><div class="lbl">Jouw naam</div><input type="text" id="nk" maxlength="16" value="${esc(nickGet())}" placeholder="Bijv. Mika" aria-label="Jouw naam">
    <button class="btn pri" id="oNew" disabled>Nieuw spel maken</button>
    <div class="row"><input type="text" id="oCode" maxlength="5" placeholder="CODE" aria-label="Spelcode" style="text-transform:uppercase;letter-spacing:.2em;font-family:var(--f-disp)"><button class="btn" id="oJoin" disabled>Meedoen</button></div>
    <div class="err" id="oErr"></div><button class="btn ghost" id="oBack">Terug</button></div></div>`);
  s.querySelector('#oBack').onclick=showMenu;
  await netInit();
  if(!NET.db){s.querySelector('#netNote').innerHTML='Geen verbinding met de online server. Controleer je internet en probeer het opnieuw. Solo en samen op 1 telefoon werken altijd.';return}
  s.querySelector('#netNote').textContent='Verbonden. Maak een spel en deel de code, of vul de code van een vriend in.';
  s.querySelector('#oNew').disabled=false;s.querySelector('#oJoin').disabled=false;
  const nick=()=>{const v=s.querySelector('#nk').value.trim().slice(0,16);if(v)nickSet(v);return v};
  s.querySelector('#oNew').onclick=async()=>{const n=nick();if(!n){s.querySelector('#oErr').textContent='Vul eerst je naam in.';return}
    const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<5;i++)code+=A[Math.floor(Math.random()*A.length)];
    try{await NET.db.doc('games/'+code).set({status:'lobby',host:NET.uid,diff:1,maxR:30,created:Date.now()});await NET.db.doc(`games/${code}/players/${NET.uid}`).set({nick:n,nation:-1,joined:Date.now()});enterLobby(code)}
    catch(e){s.querySelector('#oErr').textContent='Kon geen spel maken: '+(e&&e.message||e)}};
  s.querySelector('#oJoin').onclick=async()=>{const n=nick();const code=s.querySelector('#oCode').value.trim().toUpperCase();if(!n||code.length<5){s.querySelector('#oErr').textContent='Vul je naam en een code van 5 tekens in.';return}
    try{const g=await NET.db.doc('games/'+code).get();if(!g.exists){s.querySelector('#oErr').textContent='Geen spel gevonden met code '+code+'.';return}
      const d=g.data();if(d.status!=='lobby'){enterLobby(code);return}
      await NET.db.doc(`games/${code}/players/${NET.uid}`).set({nick:n,nation:-1,joined:Date.now()});enterLobby(code)}
    catch(e){s.querySelector('#oErr').textContent='Meedoen lukte niet: '+(e&&e.message||e)}};
}
function leaveOnline(){NET.playing=false;if(NET.unsubG){NET.unsubG();NET.unsubG=null}if(NET.unsubP){NET.unsubP();NET.unsubP=null}NET.code=null;NET.game=null}
function enterLobby(code){
  leaveOnline();NET.code=code;NET.players=[];
  const s=setScreen(`<div class="setup"><div class="col"><div class="lbl">Spelcode, deel deze met je vrienden</div><div class="code">${code}</div>
     <div id="hostOpts"></div><div class="lbl">Spelers</div><div class="plist" id="lp"></div><div style="flex:1"></div><div class="err" id="lErr"></div>
     <div class="row"><button class="btn ghost" id="lBack">Verlaten</button><button class="btn pri" style="flex:1" id="lGo" hidden>Start spel</button></div><div class="note" id="lWait"></div></div><div class="col" id="lpick"></div></div>`,true);
  s.querySelector('#lBack').onclick=()=>{leaveOnline();showOnline()};
  let myPick=-1;
  const isHost=()=>NET.game&&NET.game.host===NET.uid;
  const renderLobby=()=>{
    const g=NET.game;if(!g||screen!==s)return;const M=MODES[g.diff??1];
    const taken=new Set(NET.players.filter(p=>p.id!==NET.uid&&p.nation>=0).map(p=>p.nation));
    s.querySelector('#lp').innerHTML=NET.players.map((p,i)=>`<div class="pl"><i style="background:${PALETTE[i%PALETTE.length]}"></i><b>${esc(p.nick)}</b>${p.id===g.host?' <span class="note">host</span>':''}<span class="r">${p.nation>=0?esc(NAT[p.nation].name):'kiest…'}</span></div>`).join('');
    const ho=s.querySelector('#hostOpts');
    ho.innerHTML=`<div class="lbl">Modus</div><div class="chips">${MODES.map((m,i)=>`<button class="chip ${i===(g.diff??1)?'on':''}" data-d="${i}" ${isHost()?'':'disabled'}>${m.nm}</button>`).join('')}</div>${isHost()?`<div class="lbl">Rondes</div><div class="chips">${[20,30,45,0].map(v=>`<button class="chip ${g.maxR===v?'on':''}" data-r="${v}">${v||'∞'}</button>`).join('')}</div><div class="lbl">Tijd per beurt</div><div class="chips">${TL_OPTS.map(([v,l])=>`<button class="chip ${(g.tl??90)===v?'on':''}" data-tl="${v}">${l}</button>`).join('')}</div>`:''}`;
    ho.querySelectorAll('[data-tl]').forEach(b=>b.onclick=()=>NET.db.doc('games/'+code).update({tl:+b.dataset.tl}).catch(()=>{}));
    ho.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>NET.db.doc('games/'+code).update({diff:+b.dataset.d}).catch(()=>{}));
    ho.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>NET.db.doc('games/'+code).update({maxR:+b.dataset.r}).catch(()=>{}));
    s.querySelector('#lGo').hidden=!isHost();
    s.querySelector('#lWait').textContent=isHost()?'Start zodra iedereen een land heeft gekozen.':'Wachten tot de host het spel start…';
    const L=s.querySelector('#lpick');L.innerHTML=`<h3>Kies je land (${M.nm})</h3><div class="note">${M.sub}</div>${countryBtns(M.ids,myPick,taken)}`;
    L.querySelectorAll('.cbtn').forEach(b=>b.onclick=()=>{myPick=+b.dataset.n;NET.db.doc(`games/${code}/players/${NET.uid}`).update({nation:myPick}).catch(e=>{s.querySelector('#lErr').textContent='Kiezen lukte niet: '+(e.message||e)});renderLobby()});
  };
  s.querySelector('#lGo').onclick=async()=>{
    const ps=NET.players;const ns=ps.map(p=>p.nation);const M=MODES[NET.game.diff??1];
    if(ps.some(p=>p.nation<0||!M.ids.includes(p.nation))){s.querySelector('#lErr').textContent='Nog niet iedereen heeft een land uit deze modus gekozen.';return}
    if(new Set(ns).size!==ns.length){s.querySelector('#lErr').textContent='Twee spelers hebben hetzelfde land gekozen.';return}
    const g=NET.game;G=initialState({mode:'online',code,humans:ps.map((p,i)=>({nick:p.nick,nation:p.nation,uid:p.id,color:PALETTE[i%PALETTE.length]})),maxR:g.maxR,diff:g.diff??1,tl:g.tl??90});
    startTurn(G.order[0]);addLog('Het online spel is begonnen!',[],'info');G.order.forEach(n=>{G.N[n].seen=G.lc;G.N[n].ap=G.N[n].ap||apMax(n)});
    try{await NET.db.doc('games/'+code).update({status:'playing',state:JSON.stringify(G),rev:G.rev})}catch(e){s.querySelector('#lErr').textContent='Starten lukte niet: '+(e.message||e)}
  };
  const timer=setTimeout(()=>{const w=s.querySelector('#lWait');if(w&&!NET.game)w.textContent='De server reageert nog niet…'},10000);
  NET.unsubP=NET.db.collection(`games/${code}/players`).onSnapshot(snap=>{NET.players=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.joined-b.joined);if(G&&G.mode==='online')return;renderLobby()},e=>{});
  NET.unsubG=NET.db.doc('games/'+code).onSnapshot(snap=>{clearTimeout(timer);if(!snap.exists)return;const d=snap.data();NET.game=d;
    if(d.status==='playing'&&d.state)applyRemote(d.state);else renderLobby()},e=>{const w=s.querySelector('#lErr');if(w)w.textContent='Verbinding verbroken.'});
}
function applyRemote(json){
  let st;try{st=JSON.parse(json)}catch(e){return}
  const first=!NET.playing||!G||G.mode!=='online'||G.code!==st.code;
  if(!first&&st.rev<=G.rev)return;
  if(BATTLE)return;
  const wasMine=!first&&myTurn();
  G=st;ME=-1;for(const n in G.hum)if(G.hum[n].uid===NET.uid)ME=+n;
  if(first)NET.playing=true;
  DIP=null;dirty();
  if(first){startPlaying();return}
  renderPanel();updateHud();req();if(G.over){gameOver();return}
  if(myTurn()&&!wasMine){toast('<b>Jij bent aan zet!</b>','win');beginMyTurn()}
}
async function pushOnline(now,force){
  if(!G||G.mode!=='online'||!NET.db||!NET.code)return;if(!force&&!myTurn())return;
  clearTimeout(NET.pt);
  const go=async()=>{if(NET.writing){NET.pending=true;return}NET.writing=true;
    try{await NET.db.doc('games/'+NET.code).update({state:JSON.stringify(G),rev:G.rev,turn:curNation()})}catch(e){toast('Opslaan online mislukt: '+esc(e.message||e),'lose')}
    NET.writing=false;if(NET.pending){NET.pending=false;go()}};
  if(now)go();else NET.pt=setTimeout(go,1200);
}

/* ================= boot ================= */
function boot(){resize();showMenu();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(req)}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot();
</script>
